name: Claude Issue Triage

on:
  issues:
    types: [opened, edited]

jobs:
  triage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Issue Triage
        id: claude-triage
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Analiza el issue #${{ github.event.issue.number }} de este repositorio
            (título: "${{ github.event.issue.title }}").

            Este repo es un Tetris clásico en JavaScript vainilla (sin frameworks,
            sin build step). Toda la lógica vive en `game.js`. Usa CLAUDE.md como
            referencia de la arquitectura (piece lifecycle, scoring/leveling, game
            loop, rendering, input, pause/game over) para ubicar la sección del
            código relevante al issue.

            Pasos a seguir:
            1. Lee el título y body completos del issue con `gh issue view`.
            2. Determina labels apropiados según el contenido (ej: tipo de issue
               como bug/enhancement/question/documentation, y área afectada como
               rendering/input/scoring/gameplay/ui si aplica). No uses una lista
               fija: crea con `gh label create` cualquier label que haga falta y
               no exista todavía (revisa con `gh label list` primero para no
               duplicar), y aplícalos con `gh issue edit --add-label`.
            3. Publica UN comentario nuevo en el issue con `gh issue comment` que
               contenga un diagnóstico técnico:
               - Causa probable del problema o resumen del pedido.
               - Área/función de `game.js` involucrada, citando nombres de
                 funciones o constantes relevantes.
               - Enfoque de solución recomendado a alto nivel (sin escribir código).

            Restricciones importantes:
            - NO modifiques ningún archivo del repositorio (ni código ni
              CLAUDE.md ni README).
            - NO edites el título ni el body original del issue.
            - Tu único output son los labels aplicados y el comentario de
              diagnóstico.
          claude_args: |
            --allowedTools "Bash(gh issue view:*),Bash(gh label list:*),Bash(gh label create:*),Bash(gh issue edit:*),Bash(gh issue comment:*)"
